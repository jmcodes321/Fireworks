# Interactive Fireworks Artwork (HTML/CSS/JavaScript)

Save this as `index.html` and open it in your browser.

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Fireworks</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at bottom, #1a1a2e, #000);
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 2rem;
      letter-spacing: 3px;
      text-shadow: 0 0 10px white;
      pointer-events: none;
    }

    .subtitle {
      position: absolute;
      top: 65px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      pointer-events: none;
    }

    .subtitle2 {
      position: absolute;
      top: 90px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="title">INTERACTIVE FIREWORKS</div>
  <div class="subtitle">Click anywhere to launch fireworks</div>
  <div class="subtitle2">by Juan Miguel M. Baldiviano - 1 BSIT A</div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();

    const particles = [];
    const rockets = [];
    const stars = [];

    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 2,
        opacity: Math.random()
      });
    }

    class Rocket {
      constructor(targetX, targetY) {
        this.x = targetX;
        this.y = canvas.height;

        this.targetX = targetX;
        this.targetY = targetY;

        this.speed = 8;
        this.exploded = false;
      }

      update() {
        this.y -= this.speed;

        if (this.y <= this.targetY) {
          this.exploded = true;
          createExplosion(this.targetX, this.targetY);
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'white';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(this.x, this.y + 10);
        ctx.lineTo(this.x, this.y + 25);
        ctx.strokeStyle = 'orange';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    class Star {
      constructor(x, y, radius, opacity) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.opacity = opacity;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.radius = Math.random() * 3 + 2;
        this.color = color;

        this.life = 100;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vy += 0.05;

        this.life--;
      }

      draw() {
        ctx.save();

        ctx.globalAlpha = this.life / 100;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;

        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;

        ctx.fill();

        ctx.restore();
      }
    }

    function playExplosionSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'sawtooth';
      oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(
        40,
        audioContext.currentTime + 0.4
      );

      gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.4
      );

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.4);
    }

    function createExplosion(x, y) {
      const shapes = ['circle', 'heart', 'spiral'];
      const selectedShape = shapes[Math.floor(Math.random() * shapes.length)];
      playExplosionSound();

      const colors = [
        '#ff4d6d',
        '#ffd60a',
        '#00f5d4',
        '#c77dff',
        '#ffffff',
        '#ff9e00'
      ];

      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 120; i++) {
        const particle = new Particle(x, y, color);


    if (selectedShape === 'heart') {
         const angle = (i / 70) * Math.PI * 2;

         // Proper upright heart formula
         particle.vx =
           16 * Math.pow(Math.sin(angle), 3) * 0.6;

         particle.vy =
          -(13 * Math.cos(angle)
         - 5 * Math.cos(2 * angle)
         - 2 * Math.cos(3 * angle)
         - Math.cos(4 * angle)) * 0.6;
}



        if (selectedShape === 'spiral') {
          const angle = i * 0.3;
          const radius = i * 0.05;
          particle.vx = Math.cos(angle) * radius;
          particle.vy = Math.sin(angle) * radius;
        }

        particles.push(particle);
      }
    }

    function createFirework(x, y) {
      rockets.push(new Rocket(x, y));
    }

    function animate() {
      requestAnimationFrame(animate);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#020412';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const s of stars) {
        const star = new Star(s.x, s.y, s.radius, s.opacity);
        star.draw();
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();

        if (rockets[i].exploded) {
          rockets.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    animate();

    canvas.addEventListener('mousedown', (event) => {
      createFirework(event.clientX, event.clientY);
    });

    canvas.addEventListener('touchstart', (event) => {
      const touch = event.touches[0];
      createFirework(touch.clientX, touch.clientY);
    });

    window.addEventListener('resize', resizeCanvas);

    setInterval(() => {
      createFirework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.6
      );
    }, 4000);
  </script>

</body>
</html>
